<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN // THE NIGHT SHIFT Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Cabinet Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            lego: {
              yellow: '#FFD700',
              yellowDark: '#D4AF37',
              red: '#E51421',
              redDark: '#A60E18',
              blue: '#0055BF',
              blueDark: '#003882',
              green: '#28C840',
              greenDark: '#1A872A',
              plate: '#E5BA00',
              black: '#121212'
            }
          }
        }
      }
    }
  </script>

  <style>
    .baseplate-bg-admin {
      background-color: #0055BF;
      background-image: 
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.2) 8%, rgba(0, 56, 130, 0.6) 18%, transparent 22%),
        radial-gradient(circle at 50% 50%, #00459E 20%, transparent 24%);
      background-size: 28px 28px;
    }

    .brick-card-3d {
      background: #FFFFFF;
      border: 3px solid #121212;
      border-radius: 1.5rem;
      box-shadow: 
        inset 0 2px 0 rgba(255,255,255,0.9),
        0 8px 0 #121212,
        0 14px 18px rgba(0,0,0,0.18);
    }

    .btn-3d {
      border: 3px solid #121212;
      border-radius: 0.75rem;
      position: relative;
      transition: all 0.08s ease-in-out;
      user-select: none;
    }
    .btn-3d-green {
      background: linear-gradient(180deg, #32DE4D 0%, #28C840 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 5px 0 #1A872A, 0 8px 0 #121212;
    }
    .btn-3d-green:active {
      transform: translateY(5px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 0 0 #1A872A, 0 3px 0 #121212;
    }
    
    .btn-3d-red {
      background: linear-gradient(180deg, #FF3344 0%, #E51421 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 5px 0 #A60E18, 0 8px 0 #121212;
    }
    .btn-3d-red:active {
      transform: translateY(5px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 0 0 #A60E18, 0 3px 0 #121212;
    }

    .btn-3d-blue {
      background: linear-gradient(180deg, #3B82F6 0%, #0055BF 100%);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 5px 0 #003882, 0 8px 0 #121212;
    }
    .btn-3d-blue:active {
      transform: translateY(5px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 0 0 #003882, 0 3px 0 #121212;
    }

    .btn-3d-white {
      background: #FFFFFF;
      box-shadow: inset 0 2px 0 rgba(255,255,255,1), 0 4px 0 #D1D5DB, 0 7px 0 #121212;
    }
    .btn-3d-white:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 0 rgba(255,255,255,1), 0 0 0 #D1D5DB, 0 3px 0 #121212;
    }

    .brick-input-3d {
      background-color: #F8FAFC;
      border: 3px solid #121212;
      border-radius: 0.75rem;
      box-shadow: inset 0 3px 4px rgba(0,0,0,0.12), 0 2px 0 rgba(255,255,255,0.8);
      transition: all 0.15s;
    }
    .brick-input-3d:focus {
      outline: none;
      background-color: #FFFFFF;
      border-color: #0055BF;
      box-shadow: inset 0 2px 2px rgba(0,0,0,0.06), 0 0 0 3px #93C5FD;
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0055BF; border-left: 2px solid #121212; }
    ::-webkit-scrollbar-thumb { background: #FFD700; border: 2px solid #121212; border-radius: 999px; }
  </style>
</head>

<body class="baseplate-bg-admin text-lego-black font-sans min-h-screen relative overflow-x-hidden pb-16 selection:bg-lego-yellow selection:text-lego-black">

  <!-- PASSWORD GATE SCREEN -->
  <div id="auth-screen" class="fixed inset-0 z-50 bg-[#0055BF] flex items-center justify-center px-4">
    <div class="brick-card-3d p-8 max-w-md w-full text-center">
      <div class="mb-6">
        <div class="w-16 h-16 rounded-2xl bg-lego-yellow border-3 border-lego-black shadow-[0_5px_0_#121212] flex items-center justify-center text-3xl mx-auto mb-4">
          🔒
        </div>
        <h1 class="text-3xl font-black font-display text-lego-black uppercase tracking-tight">ADMIN GATE</h1>
        <p class="text-xs font-bold text-gray-500 mt-1 uppercase tracking-wider">Game Master Only</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <input
            type="password"
            id="admin-password"
            required
            placeholder="Enter admin password..."
            class="w-full brick-input-3d px-4 py-3.5 text-base font-bold text-center"
          >
        </div>
        <button
          type="submit"
          class="w-full py-4 px-4 btn-3d btn-3d-green text-white font-black font-display text-lg uppercase tracking-wider cursor-pointer"
        >
          Unlock Dashboard
        </button>
      </form>
      <div class="text-center mt-6">
        <a href="index.html" class="text-xs font-black text-gray-400 hover:text-lego-black transition-colors uppercase border-b-2 border-transparent hover:border-lego-black">
          ← Back to RSVP Page
        </a>
      </div>
    </div>
  </div>

  <!-- EDIT GUEST MODAL -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="brick-card-3d p-6 sm:p-8 max-w-lg w-full bg-white relative my-8 max-h-[90vh] overflow-y-auto text-left">
      <div class="flex items-center justify-between pb-4 border-b-3 border-lego-black mb-6">
        <h3 class="text-2xl font-black font-display uppercase text-lego-black">Edit RSVP Record</h3>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-lg bg-gray-200 border-2 border-lego-black font-black flex items-center justify-center hover:bg-red-500 hover:text-white transition-colors">✕</button>
      </div>

      <form id="edit-form" onsubmit="saveEditedRsvp(event)" class="space-y-4 text-xs font-bold">
        <input type="hidden" id="edit-id">
        
        <div>
          <label class="block uppercase tracking-wider mb-1 text-gray-600">Guest Name</label>
          <input type="text" id="edit-name" required class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-gray-600">Status</label>
            <select id="edit-status" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black bg-white">
              <option value="going">🎯 In (Going)</option>
              <option value="late">⏳ Maybe</option>
              <option value="ghosting">❌ Out</option>
            </select>
          </div>

          <div>
            <label class="block uppercase tracking-wider mb-1 text-gray-600">Parking</label>
            <select id="edit-parking" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black bg-white">
              <option value="driving_spot">🚗 Driveway Spot</option>
              <option value="carpool">👥 Carpooling</option>
              <option value="uber_bolt">🚕 Bolt / Dropoff</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block uppercase tracking-wider mb-1 text-gray-600">Drinking Vibe</label>
            <input type="text" id="edit-vibe" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black">
          </div>

          <div>
            <label class="block uppercase tracking-wider mb-1 text-gray-600">Deck Vote</label>
            <select id="edit-deck" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black bg-white">
              <option value="Yes">🔥 Yes</option>
              <option value="No">❌ No</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block uppercase tracking-wider mb-1 text-gray-600">Items Brought (comma separated)</label>
          <input type="text" id="edit-items" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black" placeholder="e.g. Wine, Chasers, Suya">
        </div>

        <div>
          <label class="block uppercase tracking-wider mb-1 text-gray-600">Notes / Questions</label>
          <textarea id="edit-notes" rows="2" class="w-full brick-input-3d p-3 text-sm font-bold text-lego-black"></textarea>
        </div>

        <div class="pt-4 flex gap-3">
          <button type="submit" class="flex-1 py-3.5 btn-3d btn-3d-green text-white font-black uppercase tracking-wider text-sm">Save Changes</button>
          <button type="button" onclick="closeEditModal()" class="px-6 py-3.5 btn-3d btn-3d-white text-lego-black font-black uppercase tracking-wider text-sm">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD CONTENT (Hidden until logged in) -->
  <div id="dashboard-content" class="hidden relative z-10 max-w-7xl mx-auto px-4 sm:px-6 py-8">
   
    <!-- Top Header -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-6 border-b-4 border-white/20 gap-4 mb-8">
      <div class="flex items-center gap-3.5">
        <div class="w-14 h-14 rounded-2xl bg-lego-yellow border-3 border-lego-black shadow-[0_5px_0_#121212] flex items-center justify-center text-3xl">
          🛠️
        </div>
        <div>
          <div class="text-[11px] font-black uppercase tracking-widest text-lego-yellow flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 border-2 border-lego-black rounded-full bg-lego-green animate-pulse shadow-[0_1px_0_#121212]"></span>
            Noellelacy's Game Night Pt. 2
          </div>
          <h2 class="text-2xl font-black font-display text-white uppercase tracking-tight drop-shadow-md">GAME ADMIN</h2>
        </div>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <a href="index.html" target="_blank" class="px-4 py-2.5 btn-3d btn-3d-white text-xs font-black text-lego-black flex items-center gap-2 uppercase">
          <i data-lucide="external-link" class="w-4 h-4 stroke-[3]"></i>
          <span>Live Page</span>
        </a>
        <button onclick="handleLogout()" class="px-4 py-2.5 btn-3d btn-3d-red text-xs font-black text-white uppercase">
          Logout
        </button>
      </div>
    </header>

    <!-- Quick Stats Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
      <div class="brick-card-3d p-5 text-center">
        <div class="text-4xl font-black font-display text-lego-black mb-1" id="stat-total">0</div>
        <div class="text-[11px] text-gray-500 font-black uppercase tracking-widest">Total RSVPs</div>
      </div>

      <div class="brick-card-3d p-5 text-center border-b-8 border-b-lego-green">
        <div class="text-4xl font-black font-display text-lego-green mb-1" id="stat-attending">0</div>
        <div class="text-[11px] text-gray-500 font-black uppercase tracking-widest">Attending</div>
      </div>

      <div class="brick-card-3d p-5 text-center border-b-8 border-b-lego-yellow">
        <div class="text-4xl font-black font-display text-lego-yellowDark mb-1" id="stat-parking">0 / 8</div>
        <div class="text-[11px] text-gray-500 font-black uppercase tracking-widest">Parking Spots</div>
      </div>

      <div class="brick-card-3d p-5 text-center border-b-8 border-b-lego-blue">
        <div class="text-4xl font-black font-display text-lego-blue mb-1" id="stat-items">0</div>
        <div class="text-[11px] text-gray-500 font-black uppercase tracking-widest">Brought Items</div>
      </div>
    </div>

    <!-- Management Controls & Filters -->
    <div class="brick-card-3d p-6 mb-6">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-5 border-b-3 border-lego-black">
        <div class="flex items-center gap-2 w-full sm:w-auto bg-gray-100 p-1.5 rounded-xl border-3 border-lego-black">
          <button onclick="setFilter('all')" id="filter-all" class="px-4 py-2 rounded-lg text-xs font-black bg-lego-black text-white shadow-[0_3px_0_#121212] transition-all uppercase tracking-wider">All RSVPs</button>
          <button onclick="setFilter('going')" id="filter-going" class="px-4 py-2 rounded-lg text-xs font-black text-gray-500 hover:text-lego-black transition-all uppercase tracking-wider">Attending</button>
          <button onclick="setFilter('items')" id="filter-items" class="px-4 py-2 rounded-lg text-xs font-black text-gray-500 hover:text-lego-black transition-all uppercase tracking-wider">Bringing Items</button>
        </div>

        <!-- Parking Limit Modifier Box -->
        <div class="flex items-center gap-2 bg-lego-yellow/30 p-2.5 rounded-xl border-3 border-lego-black">
          <label for="admin-max-parking" class="text-xs font-black uppercase text-lego-black">Max Parking:</label>
          <input 
            type="number" 
            id="admin-max-parking" 
            value="8" 
            min="1" 
            max="50" 
            oninput="updateParkingLimit(this.value)"
            class="w-16 brick-input-3d p-1.5 text-center text-xs font-black bg-white"
          >
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <button onclick="exportCSV()" class="px-4 py-2.5 rounded-xl border-3 border-lego-black bg-lego-yellow text-lego-black text-xs font-black uppercase tracking-wider hover:bg-yellow-400 transition-all flex items-center gap-2 shadow-[0_3px_0_#121212] active:translate-y-1 active:shadow-none">
            <i data-lucide="download" class="w-4 h-4 stroke-[3]"></i>
            <span>Export CSV</span>
          </button>
          <button onclick="clearAllData()" class="px-4 py-2.5 rounded-xl border-3 border-lego-black bg-gray-200 text-lego-red text-xs font-black uppercase tracking-wider hover:bg-red-50 transition-all flex items-center gap-2 shadow-[0_3px_0_#121212] active:translate-y-1 active:shadow-none">
            <i data-lucide="trash-2" class="w-4 h-4 stroke-[3]"></i>
            <span>Clear All</span>
          </button>
        </div>
      </div>

      <!-- TABLE CONTAINER -->
      <div class="overflow-x-auto mt-5">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-4 border-lego-black text-[11px] uppercase tracking-widest text-lego-black font-black bg-gray-50">
              <th class="p-4 min-w-[140px] rounded-tl-xl">Name</th>
              <th class="p-4 min-w-[100px]">Status</th>
              <th class="p-4 min-w-[120px]">Vibe</th>
              <th class="p-4 min-w-[130px]">Parking</th>
              <th class="p-4 min-w-[90px]">Deck Vote</th>
              <th class="p-4 min-w-[200px]">Notes & Items</th>
              <th class="p-4 text-right min-w-[140px] rounded-tr-xl">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-table-body" class="divide-y-3 divide-gray-200 text-xs font-bold">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Notification Toast -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

  <script>
    // ----------------------------------------------------
    // LIVE SUPABASE CONFIGURATION
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://dzjaobqsesiuibdcdqpi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6amFvYnFzZXNpdWliZGNkcXBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMTc2MDYsImV4cCI6MjEwNjg5MzYwNn0.bTLvB-ejlZScKhwLqpoyUyDszOmmpyANd7F8uMOm_10';

    let supabaseClient = null;
    let useLocalStorage = true;

    if (window.supabase) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        useLocalStorage = false;
      } catch (e) {
        console.error('Supabase init failed, using localStorage:', e);
      }
    }

    const STORAGE_KEY = 'noellelacy_gamenight_rsvp_list_v2';
    const SESSION_KEY = 'noellelacy_admin_logged_in';
    const SETTINGS_KEY = 'noellelacy_gamenight_settings';
    
    let rsvpList = [];
    let currentFilter = 'all';

    function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('admin-password').value;
      if (pwd === 'nightshift2024') {
        sessionStorage.setItem(SESSION_KEY, 'true');
        checkAuth();
      } else {
        alert('Incorrect password! Try again.');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    function checkAuth() {
      const isAuthed = sessionStorage.getItem(SESSION_KEY);
      if (isAuthed === 'true') {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('dashboard-content').classList.remove('hidden');
        loadAdminData();
      }
    }

    async function loadAdminData() {
      if (!useLocalStorage && supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('rsvps')
            .select('*')
            .order('created_at', { ascending: false });

          if (error) throw error;

          rsvpList = data.map(r => ({
            id: r.id,
            name: r.name,
            status: r.status,
            vibe: r.vibe,
            parking: r.parking,
            items: r.items || [],
            deckVote: r.deck_vote || 'No',
            notes: r.notes || '',
            timestamp: r.created_at ? new Date(r.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now'
          }));
        } catch (e) {
          console.error('Supabase error, loading local fallback:', e);
          loadFromStorage();
        }
      } else {
        loadFromStorage();
      }
      updateAdminStats();
      renderAdminTable();
    }

    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        rsvpList = stored ? JSON.parse(stored) : [];
      } catch (e) {
        rsvpList = [];
      }
    }

    function updateAdminStats() {
      const total = rsvpList.length;
      const attending = rsvpList.filter(r => r.status === 'going' || r.status === 'late').length;
      const cars = rsvpList.filter(r => r.status !== 'ghosting' && r.parking === 'driving_spot').length;
      
      // Read dynamic max parking limit from storage (default to 8 if not set)
      const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      const maxParking = settings.parking || 8;

      let itemsCount = 0;
      rsvpList.forEach(r => {
        if (r.status !== 'ghosting' && r.items) itemsCount += r.items.length;
      });

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-attending').textContent = attending;
      document.getElementById('stat-parking').textContent = `${cars} / ${maxParking}`;
      document.getElementById('stat-items').textContent = itemsCount;
    }

    function updateParkingLimit(newLimit) {
      const parsed = parseInt(newLimit);
      if (isNaN(parsed) || parsed < 1) return;
      
      const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      settings.parking = parsed;
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      
      updateAdminStats();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'going', 'items'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = "px-4 py-2 rounded-lg text-xs font-black bg-lego-black text-white shadow-[0_3px_0_#121212] transition-all uppercase tracking-wider";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-xs font-black text-gray-500 hover:text-lego-black transition-all uppercase tracking-wider shadow-none";
        }
      });
      renderAdminTable();
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-table-body');
      
      let filtered = [...rsvpList];
      if (currentFilter === 'going') {
        filtered = filtered.filter(r => r.status === 'going' || r.status === 'late');
      } else if (currentFilter === 'items') {
        filtered = filtered.filter(r => r.items && r.items.length > 0);
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-16 text-gray-400 font-black uppercase tracking-widest border-b-3 border-gray-200">
              No RSVPs found.
            </td>
          </tr>
        `;
        return;
      }

      let html = '';
      filtered.forEach(guest => {
        let statusBadge = '';
        if (guest.status === 'going') {
          statusBadge = `<span class="inline-block px-2.5 py-1 rounded-lg bg-lego-green text-white border-2 border-lego-black text-[10px] font-black shadow-[0_2px_0_#121212]">🎯 In</span>`;
        } else if (guest.status === 'late') {
          statusBadge = `<span class="inline-block px-2.5 py-1 rounded-lg bg-lego-yellow text-lego-black border-2 border-lego-black text-[10px] font-black shadow-[0_2px_0_#121212]">⏳ Maybe</span>`;
        } else {
          statusBadge = `<span class="inline-block px-2.5 py-1 rounded-lg bg-gray-200 text-gray-600 border-2 border-lego-black text-[10px] font-black shadow-[0_2px_0_#121212]">❌ Out</span>`;
        }

        let parkingText = guest.parking === 'driving_spot' ? '🚗 Driveway Spot' : guest.parking === 'carpool' ? '👥 Carpooling' : '🚕 Bolt / Dropoff';
        let deckFormatted = guest.deckVote === 'Yes' ? '🔥 Yes' : '❌ No';

        let itemsList = guest.items && guest.items.length ? guest.items.join(', ') : '';
        let notesText = guest.notes ? `💬 ${guest.notes}` : '';
        let combinedInfo = [itemsList, notesText].filter(Boolean).join(' | ') || '-';

        html += `
          <tr class="hover:bg-gray-50 transition-colors">
            <td class="p-4 font-black text-lego-black whitespace-normal break-words text-sm uppercase">${escapeHtml(guest.name)}</td>
            <td class="p-4 whitespace-normal break-words">${statusBadge}</td>
            <td class="p-4 text-gray-600 whitespace-normal break-words">${escapeHtml(guest.vibe || '-')}</td>
            <td class="p-4 text-gray-600 whitespace-normal break-words">${parkingText}</td>
            <td class="p-4 text-gray-600 whitespace-normal break-words">${deckFormatted}</td>
            <td class="p-4 text-gray-600 whitespace-normal break-words font-medium">${escapeHtml(combinedInfo)}</td>
            <td class="p-4 text-right whitespace-nowrap">
              <div class="flex items-center justify-end gap-2">
                <button onclick="openEditModal('${guest.id}')" class="btn-3d btn-3d-blue px-3 py-2 text-white text-[10px] font-black uppercase tracking-wider flex items-center gap-1">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5 stroke-[3]"></i> Edit
                </button>
                <button onclick="deleteRsvp('${guest.id}')" class="btn-3d btn-3d-red px-3 py-2 text-white text-[10px] font-black uppercase tracking-wider flex items-center gap-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5 stroke-[3]"></i> Del
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    function openEditModal(id) {
      const guest = rsvpList.find(r => r.id === id);
      if (!guest) return;

      document.getElementById('edit-id').value = guest.id;
      document.getElementById('edit-name').value = guest.name || '';
      document.getElementById('edit-status').value = guest.status || 'going';
      document.getElementById('edit-parking').value = guest.parking || 'driving_spot';
      document.getElementById('edit-vibe').value = guest.vibe || '';
      document.getElementById('edit-deck').value = guest.deckVote || 'No';
      document.getElementById('edit-items').value = (guest.items || []).join(', ');
      document.getElementById('edit-notes').value = guest.notes || '';

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    async function saveEditedRsvp(e) {
      e.preventDefault();
      const id = document.getElementById('edit-id').value;
      const rawItems = document.getElementById('edit-items').value;
      const itemsArray = rawItems ? rawItems.split(',').map(i => i.trim()).filter(Boolean) : [];

      const updatedData = {
        id: id,
        name: document.getElementById('edit-name').value.trim(),
        status: document.getElementById('edit-status').value,
        parking: document.getElementById('edit-parking').value,
        vibe: document.getElementById('edit-vibe').value.trim(),
        deck_vote: document.getElementById('edit-deck').value,
        items: itemsArray,
        notes: document.getElementById('edit-notes').value.trim()
      };

      if (!useLocalStorage && supabaseClient) {
        const { error } = await supabaseClient.from('rsvps').upsert(updatedData, { onConflict: 'id' });
        if (error) {
          alert("Error updating database.");
          console.error(error);
          return;
        }
      }

      const idx = rsvpList.findIndex(r => r.id === id);
      if (idx >= 0) {
        rsvpList[idx] = {
          ...rsvpList[idx],
          name: updatedData.name,
          status: updatedData.status,
          parking: updatedData.parking,
          vibe: updatedData.vibe,
          deckVote: updatedData.deck_vote,
          items: updatedData.items,
          notes: updatedData.notes
        };
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(rsvpList));
      closeEditModal();
      updateAdminStats();
      renderAdminTable();
      showToast("RSVP updated successfully! 🎯");
    }

    async function deleteRsvp(id) {
      if (!confirm("Are you sure you want to delete this RSVP?")) return;

      if (!useLocalStorage && supabaseClient) {
        const { error } = await supabaseClient.from('rsvps').delete().eq('id', id);
        if (error) {
          alert("Error deleting from database.");
          return;
        }
      }

      rsvpList = rsvpList.filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(rsvpList));
      updateAdminStats();
      renderAdminTable();
      showToast("RSVP deleted successfully.");
    }

    async function clearAllData() {
      const pin = prompt("⚠️ DANGER: Type 'NUKE' to wipe ALL RSVP records. This cannot be undone.");
      if (pin !== 'NUKE') {
        alert("Action cancelled.");
        return;
      }

      if (!useLocalStorage && supabaseClient) {
        const { error } = await supabaseClient.from('rsvps').delete().neq('id', '0');
        if (error) {
          alert("Error clearing database table.");
          return;
        }
      }

      rsvpList = [];
      localStorage.removeItem(STORAGE_KEY);
      updateAdminStats();
      renderAdminTable();
      showToast("All data cleared.");
    }

    function exportCSV() {
      if (rsvpList.length === 0) {
        alert("No data to export!");
        return;
      }

      let csv = 'Name,Status,Vibe,Parking,Items,Deck Vote,Notes,Timestamp\n';
      rsvpList.forEach(r => {
        const itemsStr = `"${(r.items || []).join('; ')}"`;
        const notesStr = `"${(r.notes || '').replace(/"/g, '""')}"`;
        csv += `"${r.name}","${r.status}","${r.vibe || ''}","${r.parking}",${itemsStr},"${r.deckVote || 'No'}",${notesStr},"${r.timestamp || ''}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', 'night_shift_rsvps.csv');
      a.click();
      showToast("CSV exported successfully! 📊");
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'flex items-center gap-3 px-5 py-4 rounded-xl border-4 border-lego-black shadow-[6px_6px_0px_0px_#121212] bg-lego-green text-white text-sm font-black pointer-events-auto transform transition-all duration-300';
      toast.innerHTML = `<span class="text-xl bg-white border-2 border-lego-black rounded-full w-8 h-8 flex items-center justify-center">🎯</span> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      
      const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      if (settings.parking) {
        document.getElementById('admin-max-parking').value = settings.parking;
      }

      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
